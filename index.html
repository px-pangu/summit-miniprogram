<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>青创汇活动报名 · 网页演示版</title>
<meta name="description" content="青创汇活动报名微信小程序的可交互网页演示版：活动首页、活动详情、在线报名、报名记录、我的。" />
<style>
:root{
  --primary:#2456E8; --primary-deep:#16389E; --primary-soft:#EBF0FE;
  --ink:#0F172A; --ink-2:#475569; --ink-3:#94A3B8;
  --bg:#F4F6FA; --card:#FFFFFF; --line:#EDF0F5;
  --green:#16A34A; --green-soft:#E8F7EE;
  --amber:#B45309; --amber-soft:#FEF3E2;
  --red:#E5484D; --red-soft:#FDEBEC;
  --grad-hero:linear-gradient(135deg,#2E6BF6 0%,#1B3FD6 58%,#122B85 100%);
  --shadow-card:0 3px 12px rgba(15,23,42,.06);
  --shadow-btn:0 6px 16px rgba(36,86,232,.30);
  --tabbar-h:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#ECEFF5;
  color:var(--ink);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:24px 12px 40px;
}
.masthead{width:100%;max-width:430px;margin-bottom:16px;text-align:center}
.masthead h1{margin:0 0 6px;font-size:19px;font-weight:700;letter-spacing:.2px}
.masthead p{margin:0;font-size:12.5px;color:#6B7688;line-height:1.7}
.badge-demo{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:20px;
  background:var(--primary-soft);color:var(--primary);font-size:11.5px;font-weight:600}

/* ---------- 手机外壳 ---------- */
.phone{
  position:relative;width:390px;max-width:100%;height:812px;max-height:calc(100vh - 190px);
  background:var(--bg);border-radius:34px;overflow:hidden;
  box-shadow:0 24px 60px rgba(15,23,42,.22),0 2px 6px rgba(15,23,42,.10);
  border:1px solid #D8DEE9;
}
.statusbar{
  height:38px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;font-size:12px;font-weight:600;color:var(--ink);
  background:#fff;flex:0 0 auto;
}
.statusbar.dark{background:transparent;color:#fff}
.statusbar .dots{display:flex;gap:4px;align-items:center}
.statusbar .dots i{width:4px;height:8px;background:currentColor;border-radius:1px;display:block;opacity:.9}
.statusbar .dots i:nth-child(4){height:6px;opacity:.45}
.statusbar .dots i:nth-child(5){height:4px;opacity:.45}

.navbar{
  height:44px;display:flex;align-items:center;justify-content:center;position:relative;
  background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto;font-size:16px;font-weight:600;
}
.navbar.transparent{background:transparent;border-bottom:none;color:#fff}
.navbar .back{position:absolute;left:10px;top:0;height:44px;display:flex;align-items:center;
  padding:0 6px;border:0;background:none;cursor:pointer;color:inherit}
.navbar .nav-act{position:absolute;right:12px;top:0;height:44px;display:flex;align-items:center;
  border:0;background:none;font-size:13px;color:var(--primary);cursor:pointer;font-weight:500}

.viewport{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg)}
.viewport::-webkit-scrollbar{width:0}
.viewport.gray{background:var(--bg)}
.viewport.white{background:#fff}

.tabbar{
  height:var(--tabbar-h);display:flex;background:#fff;border-top:1px solid var(--line);flex:0 0 auto;
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar.hidden{display:none}
.tabbar button{
  flex:1;border:0;background:none;cursor:pointer;padding:6px 0 4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:#9AA4B8;font-size:11px;font-family:inherit;
}
.tabbar button.on{color:var(--primary);font-weight:600}

/* ---------- 通用组件 ---------- */
.page{padding-bottom:16px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow-card);margin:12px;overflow:hidden}
.pad{padding:14px}
.sec-title{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;margin:0 0 4px}
.sec-title .bar{width:3px;height:15px;border-radius:2px;background:var(--primary)}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;line-height:1.7}
.tag-p{background:var(--primary-soft);color:var(--primary)}
.tag-g{background:var(--green-soft);color:var(--green)}
.tag-a{background:var(--amber-soft);color:var(--amber)}
.tag-n{background:#F1F3F7;color:var(--ink-3)}
.tag-r{background:var(--red-soft);color:var(--red)}
.tag-line{background:#F4F6FA;color:var(--ink-2);font-weight:500}

.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  border:0;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;
  font-family:inherit;cursor:pointer;background:var(--primary);color:#fff;box-shadow:var(--shadow-btn);
}
.btn:active{transform:translateY(1px)}
.btn.block{width:100%}
.btn.ghost{background:#fff;color:var(--primary);border:1px solid #D5DEF9;box-shadow:none}
.btn.disabled,.btn:disabled{background:#C7CFE0;box-shadow:none;cursor:not-allowed}

/* ---------- 首页 ---------- */
.hero{background:var(--grad-hero);color:#fff;padding:16px 16px 22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-46px;top:-56px;width:190px;height:190px;border-radius:50%;
  background:rgba(255,255,255,.09)}
.hero::before{content:"";position:absolute;right:44px;bottom:-72px;width:130px;height:130px;border-radius:50%;
  background:rgba(255,255,255,.07)}
.hero .en{font-size:10.5px;letter-spacing:2.4px;opacity:.72;font-weight:600}
.hero h2{margin:5px 0 4px;font-size:21px;font-weight:800;letter-spacing:.4px}
.hero .slogan{font-size:12px;opacity:.85;max-width:76%}
.stats{display:flex;margin:-14px 12px 0;background:#fff;border-radius:14px;box-shadow:var(--shadow-card);
  padding:12px 4px;position:relative;z-index:2}
.stats div{flex:1;text-align:center;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-size:18px;color:var(--primary);font-weight:800;line-height:1.2}
.stats span{font-size:11px;color:var(--ink-3)}

.searchbar{display:flex;align-items:center;gap:8px;margin:12px;background:#fff;border-radius:12px;
  padding:9px 12px;box-shadow:var(--shadow-card);color:var(--ink-3)}
.searchbar input{border:0;outline:none;flex:1;font-size:13.5px;font-family:inherit;color:var(--ink);background:transparent}
.chips{display:flex;gap:8px;padding:2px 12px 10px;overflow-x:auto}
.chips::-webkit-scrollbar{height:0}
.chip{flex:0 0 auto;border:0;border-radius:20px;padding:6px 14px;font-size:12.5px;font-family:inherit;
  background:#fff;color:var(--ink-2);cursor:pointer;border:1px solid var(--line)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}

.cover{height:128px;position:relative;color:#fff;padding:12px;display:flex;flex-direction:column;
  justify-content:flex-end;overflow:hidden}
.cover .cov-tag{position:absolute;left:12px;top:12px}
.cover .cov-title{font-size:15px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.cover .cov-sub{font-size:11.5px;opacity:.9;margin-top:2px;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.cover .grid{position:absolute;inset:0;opacity:.22;
  background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);
  background-size:26px 26px}
.acard{margin:0 12px 12px;background:#fff;border-radius:14px;box-shadow:var(--shadow-card);overflow:hidden;cursor:pointer}
.acard .body{padding:12px}
.acard h3{margin:0 0 4px;font-size:15px;font-weight:700;line-height:1.4}
.acard .sub{font-size:12px;color:var(--ink-3);margin-bottom:9px}
.meta{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-2)}
.meta .row svg{flex:0 0 auto}
.bar{height:5px;border-radius:3px;background:#EEF1F7;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:3px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}

/* ---------- 详情 ---------- */
.d-hero{height:196px;position:relative;color:#fff;padding:18px 16px;display:flex;flex-direction:column;justify-content:flex-end}
.d-hero h2{margin:0 0 6px;font-size:21px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.28);line-height:1.3}
.d-hero .row{gap:6px;font-size:12px;opacity:.92}
.info-row{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:flex-start}
.info-row:last-child{border-bottom:0}
.info-row .k{color:var(--ink-3);flex:0 0 62px}
.info-row .v{flex:1;color:var(--ink)}
.desc{font-size:13px;color:var(--ink-2);white-space:pre-wrap;line-height:1.8}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:#E7EBF3}
.tl-item{position:relative;padding-bottom:14px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-21px;top:5px;width:9px;height:9px;border-radius:50%;
  background:#fff;border:2px solid var(--primary)}
.tl-time{font-size:12px;font-weight:700;color:var(--primary)}
.tl-title{font-size:13.5px;font-weight:600;margin-top:1px}
.tl-desc{font-size:12px;color:var(--ink-3);margin-top:1px}
.sp{display:flex;gap:10px;align-items:center;padding:9px 0}
.sp .av{width:38px;height:38px;border-radius:50%;background:var(--primary-soft);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:0 0 auto}
.sp .n{font-size:13.5px;font-weight:600}
.sp .t{font-size:12px;color:var(--ink-3)}
.footbar{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);padding:10px 14px;
  display:flex;align-items:center;gap:12px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.footbar .price{font-size:12px;color:var(--ink-3)}
.footbar .price b{font-size:19px;color:var(--green);font-weight:800}
.footbar .btn{flex:1}

/* ---------- 报名 ---------- */
.field{padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field .lb{font-size:13px;font-weight:600;margin-bottom:7px;display:flex;align-items:center;gap:4px}
.field .lb em{color:var(--red);font-style:normal}
.field input,.field textarea,.field select{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;
  font-family:inherit;color:var(--ink);background:#FAFBFD;outline:none;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);background:#fff}
.field textarea{resize:none;height:74px}
.field .hint{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.picker{display:flex;flex-wrap:wrap;gap:8px}
.picker button{border:1px solid var(--line);background:#FAFBFD;border-radius:20px;padding:7px 13px;
  font-size:12.5px;font-family:inherit;color:var(--ink-2);cursor:pointer}
.picker button.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
.switch{display:flex;align-items:center;justify-content:space-between;font-size:13.5px}
.toggle{width:44px;height:26px;border-radius:14px;background:#DDE2EC;position:relative;transition:.2s;cursor:pointer;flex:0 0 auto}
.toggle.on{background:var(--primary)}
.toggle i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on i{left:21px}
.err{background:var(--red-soft);color:var(--red);font-size:12.5px;padding:8px 12px;border-radius:10px;margin-top:10px}

/* 成功态 */
.okbox{text-align:center;padding:26px 18px 8px}
.ok-ico{width:62px;height:62px;margin:0 auto 12px;border-radius:50%;background:var(--green-soft);
  color:var(--green);display:flex;align-items:center;justify-content:center}
.okbox h3{margin:0 0 4px;font-size:17px;font-weight:800}
.okbox p{margin:0;color:var(--ink-3);font-size:12.5px}
.codebox{margin:14px 12px;background:var(--primary-soft);border-radius:14px;padding:14px;text-align:center}
.codebox .k{font-size:11.5px;color:var(--primary);letter-spacing:1px;font-weight:600}
.codebox .v{font-size:26px;font-weight:800;letter-spacing:4px;color:var(--primary-deep);margin-top:3px}
.codebox .n{font-size:12px;color:var(--ink-2);margin-top:8px;font-weight:600}

/* ---------- 记录 / 我的 ---------- */
.rcard{margin:0 12px 12px;background:#fff;border-radius:14px;box-shadow:var(--shadow-card);padding:13px}
.rcard h3{margin:0 0 3px;font-size:14.5px;font-weight:700}
.seg{display:flex;gap:6px;margin:12px 12px 4px;background:#fff;border-radius:12px;padding:4px;box-shadow:var(--shadow-card)}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 0;font-size:12.5px;cursor:pointer;
  font-family:inherit;color:var(--ink-2)}
.seg button.on{background:var(--primary);color:#fff;font-weight:600}
.empty{text-align:center;padding:66px 24px;color:var(--ink-3)}
.empty .ico{width:58px;height:58px;margin:0 auto 12px;border-radius:50%;background:#EEF1F7;display:flex;
  align-items:center;justify-content:center;color:#B7C0D0}
.empty p{margin:0;font-size:13px}

.mine-hero{background:var(--grad-hero);color:#fff;padding:18px 16px 26px;display:flex;gap:12px;align-items:center}
.avatar{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;
  align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.mine-hero .nm{font-size:17px;font-weight:700}
.mine-hero .sb{font-size:12px;opacity:.85;margin-top:2px}
.entry{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.entry:last-child{border-bottom:0}
.entry .ic{width:32px;height:32px;border-radius:9px;background:var(--primary-soft);color:var(--primary);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.entry .tx{flex:1;font-size:13.5px}
.entry .arw{color:#C3CAD8}
.note{margin:12px;background:#FFF9EC;border:1px solid #F6E6C4;border-radius:12px;padding:11px 13px;
  font-size:11.5px;color:#8A6A1F;line-height:1.7}

.legend{max-width:430px;margin-top:18px;font-size:12px;color:#6B7688;line-height:1.8;text-align:center}
.legend b{color:#3A4356}
@media(max-width:430px){
  body{padding:12px 0 20px}
  .phone{border-radius:0;height:100vh;max-height:none;border:0;width:100%}
  .masthead{padding:0 14px}
}
</style>
</head>

<div class="masthead">

  bell:'<path d="M18.2 15.4V10.6a6.2 6.2 0 1 0-12.4 0v4.8L4 18.2h16z"/><path d="M9.8 21a2.4 2.4 0 0 0 4.4 0"/>',
  star:'<path d="M12 3.6 14.7 9.2l6.1.9-4.4 4.3 1 6.1L12 17.6l-5.4 2.9 1-6.1L3.2 10l6.1-.9z"/>'

function icon(n,s,c,sw){
  s=s||20;c=c||'currentColor';sw=sw||1.8;
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="'+c+
    '" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round">'+(P[n]||'')+'</svg>';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
function nl(s){return esc(s).replace(/\n/g,'<br>');}

/* ============================================================
   模拟数据（与云函数 admin/initDemo 的示例活动一致）
   ============================================================ */
var DAY=86400000, HOUR=3600000;
function seedActivities(){
  var now=Date.now();
  return [
    { id:'a1', title:'主论坛 · 大模型与未来产业', subtitle:'院士领衔，共话通用人工智能时代的人才机遇',

      city:'上海', venue:'上海国际会议中心', address:'浦东新区滨江大道2727号',

/* ---------- 派生计算 ---------- */
function acts(){ return seedActivities().map(function(a){
  var n=Date.now();
  var st = !a.enrollOpen ? 'closed'
        : n>a.endAt ? 'ended'
        : (n>=a.startAt && n<=a.endAt) ? 'ongoing'
        : (enrolledOf(a.id)>=a.quota) ? 'full' : 'enrolling';
  a._st=st;
  a.enrolled=enrolledOf(a.id);
  a.percent=Math.min(100,Math.round(a.enrolled/a.quota*100));
  a.statusText={enrolling:'报名中',full:'名额已满',ongoing:'进行中',ended:'已结束',closed:'未开放'}[st];
  a.statusCls={enrolling:'tag-p',full:'tag-a',ongoing:'tag-g',ended:'tag-n',closed:'tag-n'}[st];
  a.startText=fmtDT(a.startAt); a.endText=fmtDT(a.endAt);
  a.free=!a.fee;
  return a;
});}
function enrolledOf(id){
  var base=(seedActivities().filter(function(a){return a.id===id;})[0]||{}).baseEnrolled||0;
  var mine=state.regs.filter(function(r){return r.activityId===id && r.status!=='cancelled';}).length;
  return base+mine;
}
function byId(id){return acts().filter(function(a){return a.id===id;})[0];}
function p2(n){return n<10?'0'+n:''+n;}
function fmtDT(ts){var d=new Date(ts);
  return d.getFullYear()+'.'+p2(d.getMonth()+1)+'.'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes());}
function fmtD(ts){var d=new Date(ts);return d.getFullYear()+'.'+p2(d.getMonth()+1)+'.'+p2(d.getDate());}
function fmtT(ts){var d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes());}
function regMeta(s){return {pending:{t:'待审核',c:'tag-a'},approved:{t:'已通过',c:'tag-g'},
  cancelled:{t:'已取消',c:'tag-n'},rejected:{t:'未通过',c:'tag-r'}}[s]||{t:'待审核',c:'tag-a'};}

    var err='';
    if(!name) err='请填写姓名';
    else if(!/^1\d{10}$/.test(mobile)) err='请填写正确的 11 位手机号';
    else if(!school) err='请填写所在学校';
    else if(!major) err='请填写学院 / 专业';
    else if(!deg) err='请选择学历';
    else if(!dir) err='请选择参会方向';
    else if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) err='邮箱格式不正确';
    if(err){ document.getElementById('errBox').innerHTML='<div class="err">'+esc(err)+'</div>';
             vp.scrollTop=vp.scrollHeight; return; }
    var now=new Date();
    var reg={
      id:'r'+Date.now(), activityId:a.id, activityTitle:a.title,
      name:name,mobile:mobile,school:school,major:major,degree:deg,direction:dir,
      email:email,stay:stay,remark:remark,status:'pending',createdAt:Date.now(),
      code:'SUMMIT-'+p2(now.getMonth()+1)+p2(now.getDate())+'-'+String(Math.floor(Math.random()*9000)+1000),
      checkin:String(Math.floor(Math.random()*900000)+100000)
    };
    state.regs.unshift(reg); save(LS_REG,state.regs);
    renderEnrollDone(a,reg);
  };
}
function field(label,key,ph,req){
  return '<div class="field"><div class="lb">'+esc(label)+(req?'<em>*</em>':'')+'</div>'+
    '<input id="f_'+key+'" placeholder="'+esc(ph)+'"'+(key==='mobile'?' type="tel" maxlength="11"':'')+' /></div>';
}
function renderEnrollDone(a,reg){
  var m=regMeta(reg.status);
  var h=nav('报名成功',true);
  h+='<div class="page">';
  h+='<div class="card"><div class="okbox"><div class="ok-ico">'+icon('check',30,'#16A34A',2.2)+'</div>'+
     '<h3>报名提交成功</h3><p>审核结果将通过短信通知，请留意手机</p></div>'+
     '<div class="codebox"><div class="k">签 到 码</div><div class="v">'+esc(reg.checkin)+'</div>'+
     '<div class="n">'+esc(a.title)+'</div>'+
     '<div class="small muted" style="margin-top:4px">'+esc(a.startText)+' · '+esc(a.venue)+'</div></div>';
  h+='<div class="pad">'+
     infoRow('报名编号',reg.code)+
     infoRow('当前状态','<span class="tag '+m.c+'">'+m.t+'</span>')+
     infoRow('姓名',reg.name)+
     infoRow('手机号',reg.mobile)+
     infoRow('学校',reg.school)+
     infoRow('学院 / 专业',reg.major)+
     infoRow('学历',reg.degree)+
     infoRow('参会方向',reg.direction)+
     (reg.email?infoRow('邮箱',reg.email):'')+
     infoRow('住宿协助',reg.stay?'需要':'不需要')+
     (reg.remark?infoRow('备注',reg.remark):'')+
     '</div></div>';
  h+='<div style="padding:0 12px"><button class="btn ghost block" id="btnToRecords">'+
     icon('clipboard',17,'#2456E8')+'查看我的报名记录</button></div>';
  h+='</div>';
  vp.innerHTML=h;
  var rm=vp.parentNode.querySelector('.footbar'); if(rm) rm.remove();
  document.getElementById('btnBack').onclick=function(){ state.page='home'; state.tab='home'; render(); };
  document.getElementById('btnToRecords').onclick=function(){ state.page='records'; state.tab='records'; render(); };
}

/* ---------- 报名记录 ---------- */
function renderRecords(){
  var all=state.regs.slice().sort(function(a,b){return b.createdAt-a.createdAt;});
  var list=state.regFilter==='all'?all:all.filter(function(r){return r.status===state.regFilter;});
  var segs=[['all','全部'],['pending','待审核'],['approved','已通过'],['cancelled','已取消']];
  var h=nav('报名记录',false);
  h+='<div class="page">';
  h+='<div class="seg">'+segs.map(function(s){
      return '<button class="'+(state.regFilter===s[0]?'on':'')+'" data-s="'+s[0]+'">'+s[1]+'</button>';
     }).join('')+'</div>';
  if(!list.length){
    h+='<div class="empty"><div class="ico">'+icon('clipboard',26,'#B7C0D0')+'</div>'+
       '<p>暂无报名记录</p><div class="small" style="margin-top:6px">去首页挑一场活动报名吧</div></div>';
  }else{
    h+=list.map(function(r){
      var m=regMeta(r.status);
      var s='<div class="rcard" data-id="'+r.id+'">';
      s+='<div class="between"><div style="min-width:0"><h3>'+esc(r.activityTitle)+'</h3>'+
         '<div class="small muted">'+esc(r.code)+' · '+fmtDT(r.createdAt)+'</div></div>'+
         '<span class="tag '+m.c+'">'+m.t+'</span></div>';
      if(r.status!=='cancelled'){
        s+='<div style="margin-top:10px;background:var(--primary-soft);border-radius:10px;padding:10px;'+
           'display:flex;align-items:center;justify-content:space-between">'+
           '<div class="row" style="gap:8px">'+icon('qrcode',18,'#2456E8')+
           '<div><div class="small" style="color:var(--primary);font-weight:600">签到码</div>'+
           '<div style="font-size:17px;font-weight:800;letter-spacing:2px;color:var(--primary-deep)">'+esc(r.checkin)+'</div></div></div>'+
           '<span class="tag tag-p">凭码入场</span></div>';
      }
      s+='<div class="meta" style="margin-top:9px">'+
         '<div class="row">'+icon('user',14,'#94A3B8')+'<span>'+esc(r.name)+' · '+esc(r.school)+'</span></div>'+
         '<div class="row">'+icon('star',14,'#94A3B8')+'<span>'+esc(r.degree)+' · '+esc(r.direction)+'</span></div>'+
         '<div class="row">'+icon('clock',14,'#94A3B8')+'<span>'+esc(r.major)+'</span></div></div>';
      if(r.status!=='cancelled'){
        s+='<div style="text-align:right;margin-top:10px">'+
           '<button class="btn ghost" style="padding:7px 14px;font-size:12.5px" data-cancel="'+r.id+'">取消报名</button></div>';
      }
      return s+'</div>';
    }).join('');
  }
  h+='</div>';
  vp.innerHTML=h;
  var rm=vp.parentNode.querySelector('.footbar'); if(rm) rm.remove();
  Array.prototype.forEach.call(vp.querySelectorAll('.seg button'),function(b){
    b.onclick=function(){ state.regFilter=b.dataset.s; render(); };
  });
  Array.prototype.forEach.call(vp.querySelectorAll('[data-cancel]'),function(b){
    b.onclick=function(){
      var id=b.dataset.cancel;
      state.regs.forEach(function(r){ if(r.id===id) r.status='cancelled'; });
      save(LS_REG,state.regs);
      render();
    };
  });
}

/* ---------- 我的 ---------- */
function renderMine(){
  var p=state.profile||{};
  var h=nav('我的',false);
  h+='<div class="page" style="padding-bottom:0">';
  h+='<div class="mine-hero"><div class="avatar">'+
     (state.logged?icon('user',30,'#fff',1.8):icon('user',30,'rgba(255,255,255,.7)',1.6))+'</div>'+
     '<div style="flex:1;min-width:0">'+
     (state.logged
       ? '<div class="nm">'+esc(p.nick||'微信用户')+'</div><div class="sb">'+esc(p.school||'')+'</div>'
       : '<div class="nm" style="font-size:15px">未登录</div>'+
         '<div class="sb">授权后可同步头像昵称与报名档案</div>')+
     '</div>'+
     (state.logged?'':'<button class="btn" style="padding:8px 14px;font-size:13px;box-shadow:none" id="btnAuth">授权登录</button>')+
     '</div>';
  h+='<div class="card" style="margin-top:-14px;position:relative;z-index:2">';
  h+=entry('clipboard','我的报名','查看全部报名记录与签到码','records');
  h+=entry('plus','发布活动','创建活动并上传封面至云存储','publish');
  h+=entry('bell','审核通知','报名审核结果提醒','notify');
  h+='</div>';
  h+='<div class="card" style="margin-top:10px">';
  h+=entry('doc','活动报名须知','参会规则与取消政策','rule');
  h+=entry('refresh','重置演示数据','清空本地报名记录与登录状态','reset');
  h+='</div>';
  h+='<div class="note">本页为<b>网页演示版</b>，登录与数据存储均在本地浏览器完成，'+
     '不涉及真实的微信授权与云开发数据库。小程序正式版使用微信头像昵称填写能力 + 云存储。</div>';
  h+='</div>';
  vp.innerHTML=h;
  var rm=vp.parentNode.querySelector('.footbar'); if(rm) rm.remove();
  var ba=document.getElementById('btnAuth');
  if(ba) ba.onclick=function(){
    state.logged=true;
    state.profile={nick:'科创小助手',school:'示例大学 · 计算机学院'};
    save(LS_LOG,true); save(LS_PRO,state.profile);
    render();
  };
  Array.prototype.forEach.call(vp.querySelectorAll('.entry'),function(e){
    e.onclick=function(){
      var k=e.dataset.k;
      if(k==='records'){ state.tab='records'; state.page='records'; render(); }
      else if(k==='publish'){ alert('演示版未包含发布页。小程序内可在「我的 → 发布活动」创建活动并上传封面至微信云存储。'); }
      else if(k==='notify'){ alert('审核通知由云函数侧触发，演示版暂未接入。'); }
      else if(k==='rule'){ alert('1. 请填写真实信息，审核结果以短信通知\n2. 凭签到码入场\n3. 活动开始前可在报名记录中取消'); }
      else if(k==='reset'){
        state.regs=[]; state.logged=false; state.profile=null;
        save(LS_REG,state.regs); save(LS_LOG,false); save(LS_PRO,null);
        render();
      }
    };
  });
}
function entry(ic,t,s,k){
  return '<div class="entry" data-k="'+k+'"><div class="ic">'+icon(ic,17,'#2456E8')+'</div>'+
    '<div class="tx"><div>'+esc(t)+'</div><div class="small muted">'+esc(s)+'</div></div>'+
    '<span class="arw">'+icon('arrow',16,'#C3CAD8')+'</span></div>';
}

/* ---------- 启动 ---------- */
(function tick(){
  var d=new Date();
  document.getElementById('clock').textContent=d.getHours()+':'+p2(d.getMinutes());
  setTimeout(tick,20000);
})();
render();
</script>
</body>
</html>
